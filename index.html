<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Web - Estilos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a;
    color: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container { text-align: center; padding: 2rem; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
  .subtitle { color: #888; margin-bottom: 2rem; }
  .styles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .style-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 1.5rem 1rem;
    text-decoration: none;
    color: #fafafa;
    transition: all 0.2s;
  }
  .style-card:hover {
    border-color: #3b82f6;
    transform: translateY(-4px);
  }
  .preview {
    width: 100%;
    height: 80px;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .style-card h3 { font-size: 1rem; margin-bottom: 0.25rem; }
  .style-card span { font-size: 0.85rem; color: #666; }
  .p-dark { background: linear-gradient(135deg, #0a0a0a, #1a1a2e); }
  .p-light { background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
  .p-gradient { background: linear-gradient(135deg, #6366f1, #ec4899); }
  .p-elegant { background: linear-gradient(135deg, #faf7f2, #e8e4de); }
  .p-bold { background: linear-gradient(135deg, #ff6b35, #f7c59f); }
  .p-ocean { background: linear-gradient(135deg, #0077b6, #00b4d8); }
  .p-nature { background: linear-gradient(135deg, #2d6a4f, #74c69d); }
  .p-sunset { background: linear-gradient(135deg, #ff9e00, #ff5714); }
</style>
</head>
<body>
  <div class="container">
    <h1>Test Web</h1>
    <p class="subtitle">Elige un estilo para la página de servicios</p>
    <div class="styles">
      <a href="style-dark.html" class="style-card">
        <div class="preview p-dark"></div>
        <h3>Dark</h3>
        <span>Minimalista oscuro</span>
      </a>
      <a href="style-light.html" class="style-card">
        <div class="preview p-light"></div>
        <h3>Light</h3>
        <span>Limpio y claro</span>
      </a>
      <a href="style-gradient.html" class="style-card">
        <div class="preview p-gradient"></div>
        <h3>Gradient</h3>
        <span>Moderno con degradados</span>
      </a>
      <a href="style-elegant.html" class="style-card">
        <div class="preview p-elegant"></div>
        <h3>Elegant</h3>
        <span>Clásico y sofisticado</span>
      </a>
      <a href="style-bold.html" class="style-card">
        <div class="preview p-bold"></div>
        <h3>Bold</h3>
        <span>Llamativo y vibrante</span>
      </a>
      <a href="style-ocean.html" class="style-card">
        <div class="preview p-ocean"></div>
        <h3>Ocean</h3>
        <span>Azul profundo</span>
      </a>
      <a href="style-nature.html" class="style-card">
        <div class="preview p-nature"></div>
        <h3>Nature</h3>
        <span>Verde natural</span>
      </a>
      <a href="style-sunset.html" class="style-card">
        <div class="preview p-sunset"></div>
        <h3>Sunset</h3>
        <span>Cálido y acogedor</span>
      </a>
    </div>
  </div>
</body>
</html>
